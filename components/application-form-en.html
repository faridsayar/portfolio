<!-- NOTE: English inquiry form — same Web3Forms access key and field names as application-form.html. -->
<!-- NOTE: Priority timeline archived in components/inquiry-timeline-en.html (disabled site-wide). -->
<section class="section section--white" id="application-form" aria-label="Send inquiry">
  <div class="section-inner">
    <form class="inquiry-form" method="post" data-inquiry-form>
      <p class="inquiry-form__title">Contact form</p>
      <input type="hidden" name="access_key" value="c21cafeb-72cf-4e8b-b66c-69384a07c888" />
      <input type="hidden" name="subject" value="New design conversation inquiry" />
      <input type="hidden" name="from_name" value="Formaa website (EN)" />
      <input type="hidden" name="botcheck" value="" />

      <div class="inquiry-grid">
        <div class="field">
          <label class="field__label" for="en-full-name">Your name</label>
          <input
            class="field__input"
            id="en-full-name"
            name="full_name"
            type="text"
            required
            autocomplete="name"
            placeholder="Jane Smith"
          />
        </div>

        <div class="field">
          <label class="field__label" for="en-email">Your email</label>
          <input
            class="field__input"
            id="en-email"
            name="email"
            type="email"
            required
            autocomplete="email"
            inputmode="email"
            pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
            placeholder="jane.smith@example.com"
          />
        </div>
      </div>

      <div class="field field--full">
        <label class="field__label" for="en-description"
          >Description <span class="field__label-hint">– what do you need help with</span></label
        >
        <textarea
          class="field__textarea"
          id="en-description"
          name="description"
          rows="6"
          required
          autocomplete="on"
          placeholder="We want to develop a new product for series production and need help with form development and material choices. Prototype should be ready by August."
        ></textarea>
      </div>

      <div class="inquiry-footer">
        <button class="inquiry-cta" type="submit">Send inquiry</button>
        <p class="inquiry-note" data-inquiry-status aria-live="polite"></p>
        <p class="inquiry-note">Starting a conversation is free. We reply as soon as we can.</p>
      </div>
    </form>
  </div>
</section>
