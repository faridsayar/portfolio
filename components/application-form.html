<!-- NOTE: Priority timeline archived in components/inquiry-timeline.html (disabled site-wide). -->
<section class="section section--white" id="application-form" aria-label="Send forespørsel">
  <div class="section-inner">
    <!-- NOTE: One combined inquiry form section submitted via Web3Forms API (no mail client popup). -->
    <form class="inquiry-form" method="post" data-inquiry-form>
      <!-- NOTE: Static form title shown at top-left on all breakpoints. -->
      <p class="inquiry-form__title">Uforpliktende forespørsel</p>
      <!-- NOTE: Web3Forms public access key used by the static form submission endpoint. -->
      <input type="hidden" name="access_key" value="c21cafeb-72cf-4e8b-b66c-69384a07c888" />
      <input type="hidden" name="subject" value="Ny design samtale foresporsel" />
      <input type="hidden" name="from_name" value="Formaa nettside" />
      <input type="hidden" name="botcheck" value="" />

      <div class="inquiry-grid">
        <div class="field">
          <label class="field__label" for="full-name">Ditt navn</label>
          <input
            class="field__input"
            id="full-name"
            name="full_name"
            type="text"
            required
            autocomplete="name"
            placeholder="Kari Nordmann"
          />
        </div>

        <div class="field">
          <label class="field__label" for="email">Din e-post</label>
          <input
            class="field__input"
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            inputmode="email"
            pattern="^[^\s@]+@[^\s@]+\.(com|no)$"
            placeholder="kari.nordmann@example.com"
          />
        </div>
      </div>

      <div class="field field--full">
        <label class="field__label" for="description"
          >Beskrivelse <span class="field__label-hint">– hva trenger du hjelp med</span></label
        >
        <textarea
          class="field__textarea"
          id="description"
          name="description"
          rows="6"
          required
          autocomplete="on"
          placeholder="Vi ønsker å utvikle et nytt produkt som skal serieproduseres og trenger hjelp til å utvikle formen og valg av materialer. Prototype må være klar senest august."
        ></textarea>
      </div>

      <div class="inquiry-footer">
        <button class="inquiry-cta" type="submit">Send forespørsel</button>
        <!-- NOTE: Submission feedback area populated by JS after Web3Forms validation/send. -->
        <p class="inquiry-note" data-inquiry-status aria-live="polite"></p>
        <p class="inquiry-note">
          Det koster ingenting å starte dialogen med oss. Vi svarer fortløpende
        </p>
      </div>
    </form>
  </div>
</section>
